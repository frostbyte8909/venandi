[package]
name = "venandi"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
# Async runtime & HTTP
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Rate limiting (handled via reverse proxy in production)

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
poise = "0.6.2" # Note: may need update for serenity 0.12 compatibility depending on Poise's latest crate version

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Crypto
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrency primitives
dashmap = "6"

# Config & env
dotenvy = "0.15"

# Regex (ReDoS-safe)
regex = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hex encoding for HMAC output
hex = "0.4"

# Axum extras (CookieJar extractor)
axum-extra = { version = "0.9", features = ["cookie"] }

# Time (for cookie max-age)
time = "0.3"
